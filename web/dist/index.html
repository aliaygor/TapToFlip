<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TapToFlip</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#102a35;color:#fff;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100dvh}main{position:relative;width:min(100vw,56.25dvh);height:min(100dvh,177.78vw);overflow:hidden;background:#bfeaff}canvas{width:100%;height:100%;display:block;touch-action:none}header{position:absolute;top:16px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}header button{pointer-events:auto}button{font:700 16px system-ui;padding:12px 22px;border:0;border-radius:12px;background:#ffe071;color:#142e39;cursor:pointer;min-height:44px}button:focus-visible{outline:3px solid #fff;outline-offset:4px}#score{font-size:32px;color:#142e39;font-weight:900}#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#102a35d9;text-align:center;padding:28px;gap:16px}#overlay[hidden]{display:none}h1{font-size:40px;margin:0}p{font-size:17px;line-height:1.5;margin:0}#best{color:#ffe071}small{font-size:14px}
